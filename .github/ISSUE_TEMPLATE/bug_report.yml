name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please remove mailbox passwords, webhook URLs and encryption keys** from anything you paste.
        If this is a security problem, do not open an issue: see SECURITY.md.
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options: [Cloudflare, Docker or Compose, Kubernetes, Local development]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you deployed (`git rev-parse --short HEAD`) or the image tag.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: Admin → Setup status
      description: Paste the text of the Setup status panel. It says what is missing or failing.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs`, `kubectl logs`, or `npm run tail`, trimmed to the relevant lines."
      render: text
