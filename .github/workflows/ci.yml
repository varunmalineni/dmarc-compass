name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Setup scripts parse
        run: |
          node --check scripts/setup.mjs
          node --check scripts/wrangler.mjs
          node --check scripts/vendor.mjs
          python3 -m py_compile scripts/test-imap.py
