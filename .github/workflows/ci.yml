name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository or to packages.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Self-hosted bundle builds
        run: npm run build:node
      - name: Setup scripts parse
        run: |
          node --check scripts/setup.mjs
          node --check scripts/wrangler.mjs
          node --check scripts/vendor.mjs
          python3 -m py_compile scripts/test-imap.py

  # The self-hosted image, end to end, with the real parser and a real IMAP server.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run e2e:docker

  # The Kubernetes manifests, on a throwaway kind cluster.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create a cluster
        run: |
          command -v kind >/dev/null || {
            curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          }
          kind create cluster --name e2e --wait 120s
      - run: npm run e2e:k8s -- --kind e2e
