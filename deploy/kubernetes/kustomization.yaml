# dmarc-compass on Kubernetes. See README.md in this folder.
#   kubectl apply -k deploy/kubernetes        (after creating the secret)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dmarc-compass

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Settings that are not secret. Edit config.env; a change restarts the pod.
configMapGenerator:
  - name: dmarc-compass-config
    envs:
      - config.env

# The published image (x86-64 and ARM64), pinned to a release. To use your own build, point this at the image you
# pushed to your registry:
#   kustomize edit set image dmarc-compass=registry.example.com/dmarc-compass:1.0
images:
  - name: dmarc-compass
    newName: ghcr.io/varunmalineni/dmarc-compass
    newTag: "0.1.0"
